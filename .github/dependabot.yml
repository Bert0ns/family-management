version: 2
updates:
  # Maintain npm / pnpm dependencies on a weekly schedule
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '06:00'
      timezone: 'Etc/UTC'
    open-pull-requests-limit: 10
    commit-message:
      prefix: 'chore(deps)'
    labels:
      - 'dependencies'
    groups:
      production-dependencies:
        dependency-type: 'production'
      dev-dependencies:
        dependency-type: 'development'
    ignore:
      # TypeScript 7 removes the JS compiler API in favor of native tsgo;
      # typescript-eslint and ts-jest require TS < 6.1.0 until ecosystem support lands.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']

  # Maintain GitHub Actions workflows on a weekly schedule
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '06:00'
      timezone: 'Etc/UTC'
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(actions)'
    labels:
      - 'dependencies'
      - 'github-actions'
    groups:
      actions:
        patterns:
          - '*'
